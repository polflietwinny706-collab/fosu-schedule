<style>
  :root {
    --bg: #f5f7fb;
    --panel: #ffffff;
    --ink: #1f2937;
    --ink-2: #4b5563;
    --ink-3: #9ca3af;
    --line: #e5e7eb;
    --primary: #2563eb;
    --primary-soft: #dbeafe;
    --accent: #f97316;
    --accent-soft: #ffedd5;
    --shadow: 0 6px 24px rgba(15, 23, 42, 0.06);
  }
  * { box-sizing: border-box; }
  /* ===== 改动（响应式改造）：全局禁止横向溢出，手机端不出现横向滚动条 ===== */
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .header {
    background: linear-gradient(135deg, #1e3a8a 0%, #4f46e5 50%, #7c3aed 100%);
    color: #fff;
    padding: 28px 24px 24px;
    box-shadow: var(--shadow);
  }
  .header-inner { max-width: 1280px; margin: 0 auto; }
  .school { font-size: 13px; letter-spacing: 0.1em; opacity: 0.85; }
  .title { font-size: 26px; font-weight: 700; margin: 4px 0 6px; letter-spacing: 0.02em; }
  .subtitle { font-size: 13px; opacity: 0.9; }
  .container { max-width: 1280px; margin: 0 auto; padding: 22px 24px 60px; }

  .week-bar {
    background: var(--panel);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 18px;
    /* 新增（CLS 优化）：周次按钮为动态生成，未渲染前先按单行高度占位，
       避免按钮插入后容器被撑高导致页面上下位移。用 min-height 而非固定 height，
       内容更多（如周次范围变大、按钮换行）时容器仍会自动撑开。 */
    min-height: 64px;
  }
  .week-bar .label { font-size: 14px; color: var(--ink-2); margin-right: 4px; font-weight: 600; }
  .week-bar .quick { margin-left: auto; display: flex; gap: 6px; }
  .week-btn, .quick-btn {
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
    border-radius: 10px; padding: 7px 12px; font-size: 13px; cursor: pointer;
    transition: all 0.15s ease; font-weight: 500; min-width: 44px;
  }
  .week-btn:hover { border-color: var(--primary); color: var(--primary); }
  .week-btn.active {
    background: var(--primary); color: #fff; border-color: var(--primary);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
  }
  .week-bar #weekButtons { display: flex; gap: 6px; flex-wrap: wrap; }
  /* 手机端：周次按钮改为单行横滑容器，隐藏滚动条；不影响 PC 多行布局 */
  @media (max-width: 768px) {
    .week-bar #weekButtons {
      flex-wrap: nowrap;
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 8px 2px 2px;
    }
    .week-bar #weekButtons::-webkit-scrollbar { display: none; }
    .week-bar #weekButtons .week-btn { flex: 0 0 auto; }
  }
  /* 已移除「今天」徽章：不再自动定位当前周，周次由 localStorage 记忆上次选择 */
  .quick-btn:hover { border-color: var(--accent); color: var(--accent); }

  .meta-card {
    background: var(--panel); border-radius: 14px; padding: 16px 18px;
    box-shadow: var(--shadow); margin-bottom: 18px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 12px 22px;
  }
  .meta-card .wk { font-size: 20px; font-weight: 700; color: var(--primary); }
  .meta-card .desc { font-size: 13px; color: var(--ink-2); }
  .meta-card .pill {
    background: var(--primary-soft); color: var(--primary);
    padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .meta-card .pill.warn { background: var(--accent-soft); color: var(--accent); }

  .grid-wrap {
    background: var(--panel); border-radius: 14px; padding: 14px;
    box-shadow: var(--shadow); overflow-x: auto;
    /* 新增（CLS 优化）：课表网格为动态渲染（表头 1 行 + 节次 11 行），
       渲染前先按最终高度占位，避免网格插入时容器高度突变造成页面抖动。
       同样使用 min-height：课表行数/内容增多时容器依旧自动撑开，不会裁切。 */
    min-height: 780px;
  }
  .grid {
    display: grid;
    grid-template-columns: 110px repeat(7, minmax(120px, 1fr));
    gap: 6px;
    min-width: 1100px;
  }
  .gh, .gc {
    border-radius: 8px; padding: 8px 6px; text-align: center; font-size: 13px;
  }
  .gh {
    background: linear-gradient(135deg, #1e293b, #334155);
    color: #fff; font-weight: 600; letter-spacing: 0.04em;
  }
  .gh.day-header { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
  .gh.slot-header { font-size: 12.5px; }
  .gh.time-header { background: linear-gradient(135deg, #0f766e, #0d9488); }
  .gc.time-cell {
    background: #ecfdf5;
    color: #0f766e;
    font-weight: 600;
    font-size: 12px;
    border: 1px solid #a7f3d0;
    flex-direction: column;
    gap: 2px;
  }
  .gc.time-cell .slot-num { font-size: 12.5px; color: #115e59; }
  .gc.time-cell .slot-time { font-size: 11.5px; color: #047857; font-weight: 500; }
  .gc {
    background: #f8fafc; color: var(--ink-3); font-weight: 500;
    min-height: 52px; display: flex; align-items: center; justify-content: center;
    border: 1px dashed var(--line);
  }
  .course {
    width: 100%; height: 100%;
    border-radius: 8px; padding: 7px 6px;
    font-size: 12px; line-height: 1.4; text-align: left;
    color: #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
    display: flex; flex-direction: column; justify-content: center;
  }
  .course:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
  .course:active { transform: translateY(0) scale(0.97); }
  .course .name { font-weight: 700; font-size: 12.5px; margin-bottom: 3px; }
  .course .loc, .course .teacher { font-size: 11px; opacity: 0.95; }
  .course .tap-hint { font-size: 9.5px; opacity: 0.7; margin-top: 2px; }

  /* ===== 新增：今日实时课程高亮（正在上课 / 即将上课） =====
     仅作用于"今天星期"那一列（今日列由 JS 动态计算，见 TODAY_DAY_IDX），其余列完全不变。
     高亮用 box-shadow 描边 + 动画实现，不占用布局空间；状态徽标为卡片内嵌第一行，
     flex 纵向排列向下推开，不缩小/挤压原有的课程名、教室、老师文本。 */
  .course { position: relative; } /* 为状态徽标留出定位上下文（此处仅作语义说明，徽标用 flex 内嵌） */
  .course .status-badge {
    align-self: flex-start;       /* 顶部左对齐，不撑满整行 */
    margin-bottom: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 10px; font-weight: 700; line-height: 1.4;
    color: #fff;
    background: rgba(255,255,255,0.22);
    border: 1px solid rgba(255,255,255,0.55);
    white-space: nowrap;
  }
  /* 正在上课：高光高亮 + 呼吸光环（叠加在原有渐变背景之上，不影响布局） */
  .course.status-studying {
    box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--primary), 0 8px 22px rgba(37,99,235,0.45);
    animation: studyPulse 1.8s ease-in-out infinite;
    z-index: 2;
  }
  .course.status-studying .status-badge { background: #16a34a; border-color: #fff; }
  /* 即将上课：橙色描边提醒（不影响布局） */
  .course.status-comingSoon {
    box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--accent), 0 8px 20px rgba(249,115,22,0.35);
    z-index: 1;
  }
  .course.status-comingSoon .status-badge { background: var(--accent); border-color: #fff; }
  @keyframes studyPulse {
    0%,100% { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--primary), 0 8px 22px rgba(37,99,235,0.45); }
    50%     { box-shadow: 0 0 0 3px #fff, 0 0 0 9px rgba(37,99,235,0.55), 0 10px 26px rgba(37,99,235,0.55); }
  }

  /* ===== 「本周」角标（固定显示在真实当前教学周按钮右上角，与选中态独立） ===== */
  .week-btn { position: relative; }
  .week-btn .now-badge {
    position: absolute; top: -6px; right: -6px;
    background: #ef4444; color: #fff;
    font-size: 9.5px; font-weight: 700; line-height: 1;
    padding: 2px 5px; border-radius: 999px;
    box-shadow: 0 1px 3px rgba(239,68,68,0.4);
    pointer-events: none; letter-spacing: 0.02em;
  }

  .c1 { background: linear-gradient(135deg, #3b82f6, #2563eb); }
  .c2 { background: linear-gradient(135deg, #f59e0b, #ea580c); }
  .c3 { background: linear-gradient(135deg, #10b981, #059669); }
  .c4 { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
  .c5 { background: linear-gradient(135deg, #14b8a6, #0d9488); }
  .c6 { background: linear-gradient(135deg, #f43f5e, #e11d48); }
  .c7 { background: linear-gradient(135deg, #6366f1, #4f46e5); }
  .c8 { background: linear-gradient(135deg, #06b6d4, #0891b2); }
  .c9  { background: linear-gradient(135deg, #84cc16, #65a30d); }
  .c10 { background: linear-gradient(135deg, #ec4899, #db2777); }
  .c11 { background: linear-gradient(135deg, #f97316, #c2410c); }
  .c12 { background: linear-gradient(135deg, #64748b, #475569); }

  .legend {
    background: var(--panel); border-radius: 14px; padding: 16px 18px;
    box-shadow: var(--shadow); margin-top: 18px;
  }
  .legend h3 { margin: 0 0 12px; font-size: 15px; color: var(--ink); }
  .legend-list {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 10px 14px;
  }
  .legend-item { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: var(--ink-2); }
  .legend-dot { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; margin-top: 2px; }
  .legend-item small { display: block; color: var(--ink-3); font-size: 11.5px; margin-top: 1px; }
  .legend-type {
    display: inline-block; font-size: 10.5px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px; margin-left: 6px;
    vertical-align: middle; white-space: nowrap;
  }
  .legend-type.pub { background: #dbeafe; color: #1d4ed8; }
  .legend-type.ele { background: #ffedd5; color: #c2410c; }

  /* ===== 新增：图例课程可点击 + 详情面板电子书链接 ===== */
  .legend-item.legend-clickable {
    cursor: pointer; border-radius: 8px; padding: 4px 6px; margin: -4px -6px;
    transition: background .15s ease;
  }
  .legend-item.legend-clickable:hover { background: #eef2f9; }
  .ebook-link {
    display: inline-flex; align-items: center; gap: 4px;
    margin: 2px 6px 2px 0; padding: 3px 12px;
    background: #eff6ff; border: 1px solid #dbeafe; border-radius: 999px;
    color: #1d4ed8; font-size: 12.5px; text-decoration: none;
  }
  .ebook-link:hover { background: #dbeafe; }
  .ebook-none { color: var(--ink-3); font-size: 12.5px; }

  .empty-cell { color: var(--ink-3); font-size: 11.5px; }
  .footer { text-align: center; color: var(--ink-3); font-size: 12px; margin-top: 24px; }
  .day-header .date-tag { font-size: 10px; font-weight: 400; opacity: 0.75; margin-top: 2px; }

  /* ===== 右上角浮动操作区（反馈问号 + 隐藏课程，等高对齐） ===== */
  .top-actions {
    position: fixed; top: 16px; right: 16px; z-index: 900;
    display: flex; align-items: center; gap: 8px;
  }
  /* 圆形问号反馈按钮：紫色主题，与隐藏课程按钮等高 */
  .feedback-fab {
    border: none; border-radius: 999px; width: 40px; height: 40px;
    font-size: 19px; font-weight: 700; line-height: 1; cursor: pointer;
    background: #6d28d9; color: #fff;
    box-shadow: 0 6px 20px rgba(109, 40, 217, 0.35);
    transition: all 0.2s ease; display: flex; align-items: center; justify-content: center;
    font-family: inherit;
  }
  .feedback-fab:hover { background: #7c3aed; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(109, 40, 217, 0.45); }
  .feedback-fab:active { transform: translateY(0); }
  .hide-toggle {
    border: none; border-radius: 999px; padding: 10px 18px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    background: rgba(255,255,255,0.95); color: #1e3a8a;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    transition: all 0.2s ease; letter-spacing: 0.02em;
  }
  .hide-toggle:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,0.22); }

  /* ===== 反馈弹窗（课程表反馈） ===== */
  .fb-overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1100; opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease; padding: 18px;
  }
  .fb-overlay.show { opacity: 1; pointer-events: auto; }
  .fb-card {
    background: #fff; border-radius: 18px; width: 100%; max-width: 440px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3); overflow: hidden;
    max-height: 88vh; display: flex; flex-direction: column;
    transform: scale(0.94); transition: transform 0.2s ease;
  }
  .fb-overlay.show .fb-card { transform: scale(1); }
  .fb-card .fb-head {
    padding: 16px 18px; background: linear-gradient(135deg, #6d28d9, #7c3aed);
    color: #fff; display: flex; align-items: center; justify-content: space-between;
  }
  .fb-card .fb-head h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .fb-card .fb-head .fb-close {
    border: none; background: rgba(255,255,255,0.2); color: #fff;
    width: 28px; height: 28px; border-radius: 999px; cursor: pointer; font-size: 16px;
  }
  .fb-card .fb-body { padding: 16px 18px; overflow-y: auto; }
  .fb-card textarea {
    width: 100%; min-height: 96px; resize: vertical; box-sizing: border-box;
    border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; color: #1e293b; line-height: 1.5;
  }
  .fb-card textarea:focus { outline: none; border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
  .fb-note {
    margin: 12px 0 0; padding: 10px 12px; background: #f5f3ff; border-radius: 10px;
    font-size: 12px; line-height: 1.7; color: #5b21b6;
    white-space: pre-line; word-break: break-word; /* 支持管理员编辑的多行说明文本 */
  }
  .fb-note b { color: #4c1d95; }
  .fb-public-title { margin: 16px 0 8px; font-size: 13px; font-weight: 700; color: #4c1d95; }
  .fb-public-list { display: flex; flex-direction: column; gap: 10px; }
  .fb-public-item {
    border: 1px solid #ede9fe; border-radius: 10px; padding: 10px 12px; background: #faf8ff;
  }
  .fb-public-item .fb-q { font-size: 13px; color: #1e293b; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .fb-public-item .fb-a { margin-top: 6px; font-size: 12.5px; color: #15803d; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .fb-public-item .fb-a::before { content: "管理员回复："; color: #166534; font-weight: 600; }
  .fb-empty { font-size: 12.5px; color: #94a3b8; padding: 6px 2px; }
  .fb-card .fb-foot {
    padding: 14px 18px; border-top: 1px solid #f1f5f9; display: flex; gap: 10px; justify-content: flex-end;
  }
  .fb-card .fb-foot button {
    border: none; border-radius: 999px; padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.15s ease;
  }
  .fb-btn-close { background: #f1f5f9; color: #475569; }
  .fb-btn-close:hover { background: #e2e8f0; }
  .fb-btn-submit { background: #6d28d9; color: #fff; }
  .fb-btn-submit:hover { background: #7c3aed; }
  /* Toast 提示 */
  .fb-toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px);
    background: rgba(15, 23, 42, 0.92); color: #fff; padding: 11px 20px; border-radius: 999px;
    font-size: 13.5px; z-index: 1200; opacity: 0; pointer-events: none; transition: all 0.25s ease;
  }
  .fb-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 隐藏课程管理面板 ===== */
  .hide-overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.35);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1050; opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease; padding: 20px;
  }
  .hide-overlay.show { opacity: 1; pointer-events: auto; }
  .hide-card {
    background: #fff; border-radius: 20px; width: 100%; max-width: 460px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25); overflow: hidden;
    max-height: 86vh; display: flex; flex-direction: column;
    transform: scale(0.9); transition: transform 0.25s ease;
  }
  .hide-overlay.show .hide-card { transform: scale(1); }
  .hide-head { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; padding: 20px 26px; }
  .hide-head .hh-title { font-size: 18px; font-weight: 700; }
  .hide-head .hh-sub { font-size: 12.5px; opacity: 0.9; margin-top: 4px; line-height: 1.6; }
  .hide-body { padding: 14px 18px 18px; overflow-y: auto; }
  .hide-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; background: #f8fafc; }
  .hide-row.pub { opacity: 0.62; }
  .hide-info { display: flex; align-items: center; gap: 10px; }
  .hide-dot { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
  .hide-name { font-size: 14px; font-weight: 600; color: var(--ink); }
  .hide-row small { display: block; color: var(--ink-3); font-size: 11.5px; margin-top: 1px; }
  .hide-switch { border: none; border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; background: #e5e7eb; color: var(--ink-2); transition: all 0.15s; font-family: inherit; }

  @media (max-width: 768px) {

/* 各节次对应的时间（来自桌面"时间节次.jpg"） */
const TIME_SLOTS = {
  1:  { start: "08:00", end: "08:40" },
  2:  { start: "08:45", end: "09:25" },
  3:  { start: "09:40", end: "10:20" },

/* ===== 新增：今日实时课程状态判定（正在上课 / 即将上课） =====
   严格遵循需求：
   1) 只在页面加载时计算一次（见底部 TODAY_STATUS / TODAY_DAY_IDX 初始化），轮询同步与切周都不再重算；
      只有用户手动刷新网页才会重新计算（不在 render / loadSchedule 内重算）。
   2) 仅对"浏览器本地今天星期"那一列生效，其它星期列完全不变（在 render 中按今日列索引过滤）。
   3) 仅当本地时间在 7:00–21:30 窗口内才执行状态判断，窗口外全部课程维持普通样式。
   4) 全部只用浏览器原生 Date API，禁止引入 moment / dayjs 等第三方时间库。
   状态取值：'' （普通）/ 'studying' （正在上课）/ 'comingSoon' （即将上课）。 */

/* 时间工具：把 "HH:MM" 解析为「当天从 00:00 算起的分钟数」，便于区间比较 */
function hhmmToMinutes(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}

/* 时间窗口判断：本地时间是否落在 7:00 ~ 21:30（含 7:00，不含 21:30） */
function inActiveWindow(now) {
  const mins = now.getHours() * 60 + now.getMinutes();
  return mins >= 7 * 60 && mins < 21 * 60 + 30; // 420 <= mins < 1290
}

/* 计算今日各节次(period)的课程状态，返回 { 节次: 状态 } 映射。
   - studying（正在上课）：当前时间在节次 [start, end) 区间内；
   - comingSoon（即将上课）：当前时间落在「上一节次的结束时间」到「本节次开始时间」的课间窗口
     （即 [end(prevPeriod), start(thisPeriod))，例如第3节 10:20 下课 → 第4节 10:25 上课的间隙；
      这段时间归到第4节，提示"即将上课"）。
   返回空对象 {} 表示不在活跃窗口（7:00–21:30 之外）或无需高亮，全部课程维持普通样式。 */
function computeTodayStatus() {
  const now = new Date();
  if (!inActiveWindow(now)) return {};            // 窗口外：全部普通样式，不产生任何高亮
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const statusByPeriod = {};
  // 配置驱动：遍历 TIME_SLOTS 各节次（按节次号升序），用相邻节次推导课间窗口，无需写死星期/节次
  const periods = Object.keys(TIME_SLOTS).map(Number).sort((a, b) => a - b);
  for (let i = 0; i < periods.length; i++) {
    const p = periods[i];
    const { start, end } = TIME_SLOTS[p];
    const sM = hhmmToMinutes(start);
    const eM = hhmmToMinutes(end);
    if (nowMins >= sM && nowMins < eM) {
      statusByPeriod[p] = "studying";             // 区间内 = 正在上课
    } else if (i > 0) {
      const prevEnd = hhmmToMinutes(TIME_SLOTS[periods[i - 1]].end);
      if (nowMins >= prevEnd && nowMins < sM) {
        statusByPeriod[p] = "comingSoon";         // 上一节结束 → 本节开始 的课间 = 即将上课
      }
    }
  }
  return statusByPeriod;
}

/* 今日星期列索引：由浏览器本地 Date 动态推导，与 DAYS([周一…周日]) 顺序一一对应。
   公式 (getDay()+6)%7：JS getDay() 0=周日,1=周一…6=周六；映射后 0=周一…6=周日。
   全程动态计算，不写死任何星期数字。 */
function getTodayDayIndex() {
  return (new Date().getDay() + 6) % 7;
}

const WEEK_BASE_OFFSET = 1;            // WEEK_BASE 对应第 1 教学周
let WEEK_START = 2;                    // 起始教学周（展示范围，可配置）
let WEEK_END = 18;                     // 结束教学周（展示范围，可配置）
let HEAD_COUNT = 21;                   // 共修读人数（可配置，"共XX人"）

/* ===== 配置：本学期第 1 教学周起始公历日期（由管理员后台配置，随课表数据下发） =====
   默认沿用：2026-09-14 是第 2 教学周周一 ⇒ 第 1 教学周周一为 2026-09-07。 */
const DEFAULT_WEEK_BASE = "2026-09-07";
let WEEK_BASE = DEFAULT_WEEK_BASE;   // "YYYY-MM-DD"，第 1 教学周周一

/* 兼容旧引用：BASE_DATE 仍指向默认基准（只读语义），真正生效的是 WEEK_BASE */
const BASE_DATE = new Date(2026, 8, 7);

/* ===== 全局公共教学周计算层 =====
   全站唯一入口：课表视图 / 详情弹窗 / 呼吸灯 / 自动定位 统一调用本段函数，
   任何模块禁止再独立编写日期加减或周次推算逻辑。 */

/* ---------- 基础日期工具（全部本地时区，规避 UTC 跨天/跨年误差） ---------- */
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

/* "YYYY-MM-DD" → Date；非法输入返回 null（跨月/跨年/空值均安全） */
function parseYMD(s) {
  if (typeof s !== "string") return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s.trim());
  if (!m) return null;
  const y = +m[1], mo = +m[2], da = +m[3];
  const d = new Date(y, mo - 1, da);
  // 校验真实存在（排除 2026-02-30 这类非法日期）
  if (d.getFullYear() !== y || d.getMonth() !== mo - 1 || d.getDate() !== da) return null;
  return d;
}
function toYMD(d) {
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
/* 该日期所在自然周的周一（周一为一周起点，与 DAYS 顺序一致） */
function mondayOf(d) {
  const t = startOfDay(d);
  const wd = (t.getDay() + 6) % 7;   // 0=周一 … 6=周日
  return addDays(t, -wd);
}

/* ---------- 真实日期 → 教学周 / 星期（仅基于 WEEK_BASE 推算，无任何放假处理） ---------- */
/* 真实日期 → 该用第几周的课 */
function teachWeekOf(realDate) {
  const base = parseYMD(WEEK_BASE) || BASE_DATE;
  return Math.round((mondayOf(realDate) - mondayOf(base)) / (7 * 86400000)) + WEEK_BASE_OFFSET;
}
/* 真实日期 → 该用星期几(1-7) 的课（自然日历直推） */
function teachDayOf(realDate) {
  return ((startOfDay(realDate).getDay() + 6) % 7) + 1;
}

/* ---------- 核心：日期 → 教学周（极简：仅 base + 自然日历） ----------
   返回 { week, valid, beforeTerm }，无任何放假耦合。 */
function computeTeachingWeek(today) {
  const base = parseYMD(WEEK_BASE);
  const t = startOfDay(today || new Date());
  if (!base) return { week: null, valid: false };
  const baseMonday = mondayOf(base);
  const targetMonday = mondayOf(t);
  if (targetMonday < baseMonday) {
    return { week: null, valid: false, beforeTerm: true };
  }
  const n = Math.round((targetMonday - baseMonday) / (7 * 86400000)) + WEEK_BASE_OFFSET;
  return { week: n, valid: n >= WEEK_START && n <= WEEK_END };
}

/* ---------- 反向：教学周 → 日期（与 computeTeachingWeek 互逆） ----------
   表头日期、详情弹窗日期都走这里，保证与周号推算完全一致。 */
function getWeekDate(week, day) {
  const base = parseYMD(WEEK_BASE) || BASE_DATE;
  /* 自然公式：第 week 周星期 day = 基准周一 + (week-WEEK_BASE_OFFSET)*7 + (day-1) */
  const monday = mondayOf(base);
  return addDays(monday, (week - WEEK_BASE_OFFSET) * 7 + ((day || 1) - 1));
}
function formatDateDisplay(date) {
  return `${date.getMonth() + 1}/${date.getDate()}`;
}

/* ---------- 自动定位（功能3） ----------
   页面打开时调用：得到实时推算的教学周并直接展示。 */
function resolveInitialWeek() {
  const r = computeTeachingWeek(new Date());
  if (r.beforeTerm) return WEEK_START;                   // 未开学：停在第 1 教学周
  if (r.week == null) return WEEK_START;
  return Math.max(WEEK_START, Math.min(WEEK_END, r.week));
}

/* ---------- 全局固定「真实当前教学周」（功能：本周角标） ----------
   仅依赖系统日期 + WEEK_BASE；不受用户当前浏览的 currentWeek 切换影响。
   返回 WEEK_START..WEEK_END 范围内整数；未开学或已超出范围时回落到 WEEK_START。 */
function realCurrentTeachingWeek() {
  const r = computeTeachingWeek(new Date());
  if (r.week == null) return WEEK_START;
  return Math.max(WEEK_START, Math.min(WEEK_END, r.week));
}

/* 已移除自动定位函数 computeCurrentWeek：周次改为由 localStorage 记忆上次选择（见 loadWeek / saveWeek） */

function weekInRanges(week, ranges) {
  return ranges.some(([a,b]) => week >= a && week <= b);
}

/* 构建本周课表：schedule[行索引][星期索引] = [课程条目...] */
function buildWeek(week) {
  const schedule = ROWS.map(() => [[],[],[],[],[],[],[]]);
  COURSES.forEach(c => {
    if (isHidden(c)) return;
    c.slots.forEach(s => {
      if (!weekInRanges(week, s.weeks)) return;
      s.slot.forEach(slotNum => {
        const rowIdx = ROWS.findIndex(r => r.num === slotNum);
        if (rowIdx === -1) return;
        schedule[rowIdx][s.day - 1].push({
          course: c,
          loc: s.loc,
          teacher: c.teacher,
          slotNum: slotNum,
          currentStatus: "" // 新增：实时状态标记，取值 '' / 'studying' / 'comingSoon'（仅今日列在 render 中赋值）
        });
      });
    });
  });
  return schedule;
}

/* 按教学周缓存课表网格：同一屏可能跨周取课，逐列按需构建并缓存，避免同一周重复 buildWeek。 */
const _weekGridCache = {};
function weekGrid(week) {
  if (!_weekGridCache[week]) _weekGridCache[week] = buildWeek(week);
  return _weekGridCache[week];
}
function clearWeekGridCache() {
  for (const k in _weekGridCache) delete _weekGridCache[k];
}

/* 周次记忆：页面初始化只读取 localStorage 中上次浏览的周次并恢复；无记录则用起始教学周。
   已彻底删除"打开即强制跳到真实教学周"的初始化跳转，避免两次渲染切换造成闪烁。 */
const WEEK_KEY = "fosu_week";
function loadWeek() {
  /* 初始化只做一件事：读取 localStorage 中上次浏览的周次并直接恢复。
     无记录时使用合理默认周次（起始教学周 WEEK_START）；不再推算真实教学周。 */
  try {
    const v = parseInt(localStorage.getItem(WEEK_KEY), 10);
    if (!isNaN(v) && v >= WEEK_START && v <= WEEK_END) return v;
  } catch (_) {}
  return WEEK_START;
}
function saveWeek() {
  try { localStorage.setItem(WEEK_KEY, String(currentWeek)); } catch (_) {}
}
let currentWeek = loadWeek();
/* 手机端横滑容器：记录已定位过的浏览周。浏览周在此刻（渲染之前）已由 loadWeek() 同步确定，
   横滑定位只跟随"浏览周是否变化"触发，避免重复 render 造成二次滚动。 */
let _lastScrolledWeek = null;

/* 初始化渲染守卫：false = 尚未完成首次渲染。
   首次渲染前严格按 ① 拉全局配置 → ② 读 localStorage 定浏览周 → ③ 才渲染 的顺序执行，
   因此"周次范围变更导致先渲染旧范围再重建 DOM"的二次渲染闪烁被彻底消除。 */
let _initialRendered = false;

/* 新增：教学周配置应用（供数据加载后调用）
   用"配置签名"判断：首次加载或管理员改了基准日期 → 重新确定浏览周（仍只恢复上次浏览周）；
   轮询期间配置没变 → 不动 currentWeek，绝不把用户手动选的周次拉回去。 */
let weekCfgSig = null;
function applyWeekConfig(arg) {
  const data = (arg && typeof arg === "object") ? arg : { weekBase: (typeof arg === "string" ? arg : null) };
  /* 兼容迁移：旧字段 weekBase（第2周周一）→ week1Base（第1周周一），减 7 天 */
  let w1 = null;
  if (data.week1Base && parseYMD(data.week1Base)) w1 = data.week1Base;
  else if (data.weekBase && parseYMD(data.weekBase)) w1 = toYMD(addDays(parseYMD(data.weekBase), -7));
  const base = (typeof w1 === "string" && parseYMD(w1)) ? w1 : DEFAULT_WEEK_BASE;
  if (typeof data.weekStart === "number") WEEK_START = data.weekStart;
  if (typeof data.weekEnd === "number") WEEK_END = data.weekEnd;
  if (typeof data.headCount === "number") HEAD_COUNT = data.headCount;
  const sig = "W1=" + base + "|WS=" + WEEK_START + "|WE=" + WEEK_END + "|HC=" + HEAD_COUNT;
  if (sig === weekCfgSig) return;
  weekCfgSig = sig;
  WEEK_BASE = base;
  if (typeof currentWeek !== "undefined") {
    if (!_initialRendered) {
      /* 初始化阶段（此刻尚未渲染）：配置就绪后用最终展示范围重新确定浏览周 ——
         localStorage 优先、无记录用默认起始周。尚未渲染，故不会产生任何闪烁。 */
      const restored = loadWeek();
      if (restored !== currentWeek) { currentWeek = restored; saveWeek(); }
    } else {
      /* 运行期：不打扰用户当前浏览，仅当越出新的展示范围时夹紧并回写 localStorage */
      const fixed = Math.max(WEEK_START, Math.min(WEEK_END, currentWeek));
      if (fixed !== currentWeek) { currentWeek = fixed; saveWeek(); }
    }
  }
}

/* ===== 新增①：详情面板「电子书链接」渲染，课表格子与图例共用 ===== */
function ebookEscape(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function renderEbookLinks(course) {
  const el = document.getElementById("detailEbook");
  if (!el) return;
  const list = Array.isArray(course.ebookLinks)
    ? course.ebookLinks.filter(l => l && String(l.url || "").trim())
    : [];
  if (!list.length) {                       // 无链接时给出提示
    el.innerHTML = '<span class="ebook-none">暂无电子书链接</span>';
    return;
  }
  el.innerHTML = list.map(l => {
    const title = ebookEscape(String(l.title || "").trim() || "电子书链接");
    let url = String(l.url).trim();
    if (!/^https?:\/\//i.test(url)) url = "https://" + url.replace(/^\/+/, "");
    return `<a class="ebook-link" href="${ebookEscape(url)}" target="_blank" rel="noopener noreferrer">📖 ${title}</a>`;
  }).join("");
}

/* 只展示当前周 + 当前节次对应的排课信息 */
function showDetail(item, week, day) {
  const course = item.course;

  document.getElementById("detailCredit").textContent = course.hours
    ? `${course.credit} 学分 / ${course.hours} 学时`
    : `${course.credit} 学分`;

  const timeEl = document.getElementById("detailTime");
  const locEl = document.getElementById("detailLoc");

  if (matchingSlots.length > 0) {
    const s = matchingSlots[0];
    const dayName = DAYS[s.day - 1];
    const slotStr = s.slot.join("-") + "节";
    const timeStr = s.slot.map(n => {

    timeEl.innerHTML = `<div class="time-block">

    </div>`;
    locEl.textContent = s.loc;
  } else {
    timeEl.textContent = "本周无此课程排课";
    locEl.textContent = "—";
  }

  renderEbookLinks(course);   /* 新增：底部渲染电子书链接（两处详情共用） */
  overlay.classList.add("show");
}

function hideDetail() {
  overlay.classList.remove("show");
}

detailClose.addEventListener("click", hideDetail);
overlay.addEventListener("click", (e) => {
  if (e.target === overlay) hideDetail();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { hideDetail(); closeHidePanel(); }
});

function render() {
  // 周次按钮（本周按钮永久带角标；选中态由 .active 控制，与角标互不干扰）
  const wb = document.getElementById("weekButtons");
  wb.innerHTML = "";
  const nowWeek = realCurrentTeachingWeek();
  for (let w = WEEK_START; w <= WEEK_END; w++) {
    const b = document.createElement("button");
    let cls = "week-btn";
    if (w === currentWeek) cls += " active";
    if (w === nowWeek) cls += " now";
    b.className = cls;
    b.textContent = `第 ${w} 周`;
    if (w === nowWeek) {
      const tag = document.createElement("span");
      tag.className = "now-badge";
      tag.textContent = "本周";
      b.appendChild(tag);
    }
    b.onclick = () => { currentWeek = w; saveWeek(); render(); };
    wb.appendChild(b);
  }

  // 手机端横滑容器：把当前选中周次滚动到可视区域中央
  /* 浏览周已先于本渲染确定；此处只做定位：
     - 浏览周发生变化 → 平滑滚动到中央（仅一次）
     - 浏览周未变化（初始化重渲染 / 轮询）→ 瞬时复原位置，不产生二次滚动动画 */
  const _activeBtn = wb.querySelector(".week-btn.active");
  if (_activeBtn && _lastScrolledWeek !== currentWeek) {
    _lastScrolledWeek = currentWeek;
    /* 等周按钮 DOM 完全插入并完成布局后（下一帧）再执行滚动，避免滚动引发二次布局抖动 */
    requestAnimationFrame(() => {
      if (typeof _activeBtn.scrollIntoView === "function") {
        _activeBtn.scrollIntoView({ inline: "center", block: "nearest" });
      }
    });
  } else if (_activeBtn && typeof wb.scrollTo === "function") {
    const _left = _activeBtn.offsetLeft - (wb.clientWidth - _activeBtn.offsetWidth) / 2;
    wb.scrollTo({ left: Math.max(0, _left), behavior: "auto" });
  }

  document.getElementById("wkBig").textContent = `第 ${currentWeek} 周`;
  renderHeaderMeta();

  /* 每一列按【真实日期 → 教学日】取课（仅基于 WEEK_BASE 自然日历推算，无放假处理） */
  clearWeekGridCache();
  const colPlan = [];
  for (let d = 0; d < 7; d++) {
    const rd = getWeekDate(currentWeek, d + 1);
    colPlan.push({
      realDate: rd,
      week: teachWeekOf(rd),
      day:  teachDayOf(rd)
    });
  }

  // 统计课程数（按独立节次计）
  let count = 0;
  ROWS.forEach((row, ri) => {
    for (let d = 0; d < 7; d++) {
      count += weekGrid(colPlan[d].week)[ri][colPlan[d].day - 1].length;
    }
  });
  document.getElementById("wkCount").textContent = `${count} 节课`;

  /* 已移除「今天/本周」标签：周次不再自动定位，由 localStorage 记忆上次选择 */

  // 备注：管理员写入的本周备注（仅本周可见，切到其他周自动隐藏；管理员编辑后 3 秒内轮询同步）
  const note = document.getElementById("wkNote");
  const noteText = (NOTES[currentWeek] || "").trim();
  if (noteText) {
    note.textContent = noteText;
    note.style.display = "";
  } else {
    note.textContent = "";
    note.style.display = "none";
  }

  // 表格
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  // 表头行
  const timeHeader = document.createElement("div");
  timeHeader.className = "gh time-header";
  timeHeader.textContent = "节次";
  grid.appendChild(timeHeader);
  DAYS.forEach((dName, di) => {
    const h = document.createElement("div");
    h.className = "gh day-header";
    const dt = getWeekDate(currentWeek, di + 1);
    const dateStr = formatDateDisplay(dt);
    h.innerHTML = `${dName}<div class="date-tag">${dateStr}</div>`;
    grid.appendChild(h);
  });

  // 数据行
  ROWS.forEach((row, ri) => {
    // 时间列
    const t = TIME_SLOTS[row.num];
    const cellT = document.createElement("div");
    cellT.className = "gc time-cell";
    cellT.innerHTML = `
      <div class="slot-num">第 ${row.num} 节</div>
      <div class="slot-time">${t.start}–${t.end}</div>
    `;
    grid.appendChild(cellT);

    // 周一~周日
    // 仅"今天星期"那一列才执行实时状态判断；其余列一律普通样式，绝不出现高亮
    for (let d = 0; d < 7; d++) {
      // 当前列是否等于"今天星期"列：一次性计算的 TODAY_DAY_IDX（由浏览器本地 Date 推导）
      const isTodayCol = (d === TODAY_DAY_IDX);
      // 取课：按教学日映射（仅基于 WEEK_BASE 自然日历推算）
      const plan = colPlan[d];
      const items = weekGrid(plan.week)[ri][plan.day - 1];
      const cell = document.createElement("div");
      if (items.length === 0) {
        cell.className = "gc empty-cell";
        cell.textContent = "—";
      } else {
        cell.className = "gc";
        cell.style.background = "transparent";
        cell.style.border = "none";
        cell.style.padding = "2px";
        items.forEach(it => {
          const c = document.createElement("div");
          c.className = "course " + it.course.cls;
          /* 呼吸灯前置校验（Bug 修复）：必须"当前浏览周 === 系统推算的真实教学周"才允许点亮。
             nowWeek = realCurrentTeachingWeek()（render 顶部已算好，此处直接复用，不重复计算）。
             浏览其它周次时，无论现实时间是否命中课程时间段，一律关闭正在上课 / 即将上课的
             呼吸灯、标签与高亮样式。 */
          it.currentStatus = (isTodayCol && currentWeek === nowWeek) ? (TODAY_STATUS[it.slotNum] || "") : "";
          if (it.currentStatus) c.classList.add("status-" + it.currentStatus); // status-studying / status-comingSoon
          const badgeText =
            it.currentStatus === "studying" ? "正在上课" :
            it.currentStatus === "comingSoon" ? "即将上课" : "";
          c.innerHTML = `
            ${badgeText ? `<div class="status-badge">${badgeText}</div>` : ""}
            <div class="name">${it.course.name}</div>
            <div class="loc">${it.loc}</div>
            <div class="teacher">${it.teacher} 老师</div>
          `;
          c.addEventListener("click", () => showDetail(it, currentWeek, d + 1));
          cell.appendChild(c);
        });
      }
      grid.appendChild(cell);
    }
  });
}

/* ===== 新增（响应式改造 A-Plus）：手机端"显示周六、周日"复选框 =====
   仅切换 .grid 的 .show-weekend 类来控制第7/8列(周六、周日)显隐与 .grid-wrap 局部横向滚动；
   不重新请求后端、不重新渲染课表、不改动任何原有业务逻辑与隐藏过滤逻辑。 */
(function bindWeekendToggle() {
  const chk = document.getElementById("showWeekendChk");
  const grid = document.getElementById("grid");
  if (!chk || !grid) return;
  chk.addEventListener("change", () => {
    if (chk.checked) grid.classList.add("show-weekend");
    else grid.classList.remove("show-weekend");
  });
})();

/* 图例 */
function renderLegend() {
  const list = document.getElementById("legendList");
  list.innerHTML = "";
  COURSES.forEach(c => {
    if (isHidden(c)) return;
    const item = document.createElement("div");
    item.className = "legend-item";
    const timeLoc = c.slots.map(s => {
      const range = s.weeks.map(([a,b]) => a === b ? `第${a}周` : `第${a}-${b}周`).join("、");
      const dayName = DAYS[s.day - 1];
      const slotStr = s.slot.join("-") + "节";
      return `${range} ${dayName} ${slotStr} · ${s.loc}`;
    }).join("；");
    item.innerHTML = `
      <div class="legend-dot ${c.cls}"></div>
      <div>
        <div>${c.name}${c.code ? ' (' + c.code + ')' : ''}<span class="legend-type ${c.pub ? 'pub' : 'ele'}">${c.pub ? '公共课' : '选修课'}</span></div>
        <small>${c.teacher} 老师 · ${c.credit}学分${c.hours ? ' / ' + c.hours + '学时' : ''}</small>
        <small>${timeLoc}</small>
      </div>
    `;
    /* 新增：图例课程可点击，唤起与课表格子一致的详情面板 */
    item.classList.add("legend-clickable");
    item.title = "点击查看课程详情";
    item.addEventListener("click", () => showCourseDetail(c));
    list.appendChild(item);
  });
}

/* 上一周 / 下一周 / 回到本周 */
document.querySelectorAll(".quick-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const act = btn.dataset.act;
    if (act === "prev") currentWeek = Math.max(WEEK_START, currentWeek - 1);
    if (act === "next") currentWeek = Math.min(WEEK_END, currentWeek + 1);
    /* 回到本周：直接读取全局已算好的真实当前教学周（不经过 localStorage 兜底） */
    if (act === "reset") currentWeek = realCurrentTeachingWeek();
    saveWeek();
    render();
  });
});

/* ===== 管理员端同步：从服务器拉取最新课表，3 秒轮询，管理员保存后自动更新 ===== */
let lastRev = -1;
let dataEdited = false;

/* 网站标题：从 /api/schedule 的 title 字段动态加载（管理员可在后台修改） */
const DEFAULT_TITLE = "26 级数学专业 研究生周课表";
function applyTitle(t) {
  const title = (typeof t === "string" && t.trim()) ? t.trim() : DEFAULT_TITLE;
  const el = document.getElementById("appTitle");
  if (el && el.textContent !== title) el.textContent = title;
  const tab = title + `（第${WEEK_START}-${WEEK_END}周）`;
  if (document.title !== tab) document.title = tab;
}

/* 小标题（副标题）：从 /api/schedule 的 subtitle 字段动态加载，与大标题一致的机制 */
const DEFAULT_SUBTITLE = "佛山大学 · 2026 年秋季学期";
function applySubtitle(s) {
  const sub = (typeof s === "string" && s.trim()) ? s.trim() : DEFAULT_SUBTITLE;
  const el = document.getElementById("appSubtitle");
  if (el && el.textContent !== sub) el.textContent = sub;
}

async function loadSchedule() {
  try {
    const r = await fetch("/api/schedule?t=" + Date.now());
    if (!r.ok) return;
    const data = await r.json();
    if (data && Array.isArray(data.courses) && data.rev !== lastRev) {
      lastRev = data.rev;
      dataEdited = !!data.edited;
      COURSES = data.courses;
      COURSES.forEach(ensurePub);
      NOTES = data.notes || {};
      applyWeekConfig(data);  /* 应用基准日期/周次范围/人数并重算周次 */
      applyTitle(data.title);
      applySubtitle(data.subtitle);
      if (_initialRendered) { renderLegend(); render(); }
    }
  } catch (e) { /* 服务器未启动或本地 file:// 打开时，使用内置默认数据 */ }
}

/* ===== 今日实时课程状态：页面加载时【只计算一次】 =====
   TODAY_DAY_IDX：今天对应的星期列索引（0=周一…6=周日），由浏览器本地 Date 动态推导。
   TODAY_STATUS：各节次→状态 映射，仅在 7:00–21:30 窗口内才有内容，否则为 {}。
   这两个变量在加载时确定后冻结；render() / 3 秒轮询(loadSchedule) 都不会重算，
   只有用户手动刷新网页才会重新执行本段、重新计算 —— 严格满足"仅加载时计算一次、不自动轮询刷新状态"。 */
const TODAY_DAY_IDX = getTodayDayIndex();
const TODAY_STATUS = computeTodayStatus();

/* ===== 初始化时序（严格三段式，全程只渲染一次，消除二次渲染闪烁）=====
   ① 拉取全局配置（第 1 教学周基准 / 起止教学周 / 人数）
   ② 同步读取 localStorage 得到上次浏览周并完成浏览周赋值
   ③ 数据与状态全部就绪后，才渲染周次按钮列表与课表主体（横向滑动定位同在此时执行） */
Promise.resolve(loadSchedule())
  .catch(() => { /* 服务器不可达时仍继续渲染，使用内置默认数据 */ })
  .then(() => { _initialRendered = true; renderLegend(); render(); });
/* 说明：下面这 3 秒轮询仅用于「管理员端改动后同步课表数据」，并不重算今日课程高亮状态；
   今日状态已在上面冻结（TODAY_STATUS / TODAY_DAY_IDX），不会被轮询改写。 */
setInterval(loadSchedule, 3000);

/* ===== 隐藏课程管理（仅本机 localStorage，不与后端同步） ===== */
const hideOverlay = document.getElementById("hideOverlay");
document.getElementById("hideToggle").addEventListener("click", openHidePanel);
document.getElementById("hideClose").addEventListener("click", closeHidePanel);
document.getElementById("hideShowAll").addEventListener("click", () => {
  setHiddenMap({});
  renderLegend(); render(); renderHideList();
});
hideOverlay.addEventListener("click", (e) => { if (e.target === hideOverlay) closeHidePanel(); });

function openHidePanel() { renderHideList(); hideOverlay.classList.add("show"); }
function closeHidePanel() { hideOverlay.classList.remove("show"); }

function renderHideList() {
  const box = document.getElementById("hideList");
  box.innerHTML = "";
  const map = getHiddenMap();
  const electives = COURSES.filter(c => !c.pub);
  const publics = COURSES.filter(c => c.pub);
  electives.forEach(c => {
    const row = document.createElement("div");
    row.className = "hide-row";
    const hidden = !!map[c.id];
    row.innerHTML = `
      <div class="hide-info">
        <span class="hide-dot ${c.cls}"></span>
        <div>
          <div class="hide-name">${c.name}</div>
          <small>${c.teacher} 老师 · 选修</small>
        </div>
      </div>
      <button class="hide-switch ${hidden ? "on" : ""}">${hidden ? "已隐藏" : "显示中"}</button>
    `;
    row.querySelector(".hide-switch").addEventListener("click", () => {
      const m = getHiddenMap();
      if (m[c.id]) delete m[c.id]; else m[c.id] = true;
      setHiddenMap(m);
      renderLegend(); render(); renderHideList();
    });
    box.appendChild(row);
  });
  publics.forEach(c => {
    const row = document.createElement("div");
    row.className = "hide-row pub";
    row.innerHTML = `
      <div class="hide-info">
        <span class="hide-dot ${c.cls}"></span>
        <div>
          <div class="hide-name">${c.name}</div>
          <small>${c.teacher} 老师 · 公共课</small>
        </div>
      </div>
      <span class="hide-lock">不可隐藏</span>
    `;
    box.appendChild(row);
  });
}
</script>
<!-- 新增：PWA 单实例 + 唤起自动刷新（仅特性检测，不影响原有课表逻辑） -->
<script src="pwa.js"></script>
<script src="push.js"></script>

<script>
/* ===== 课程表反馈模块（独立叠加，不改动原有课表/隐藏课程/高光/PWA 逻辑） =====
   后端：Cloudflare Pages Functions，接口前缀 /api/feedback/*。
   Pages Functions 与网页同一域名，直接使用相对路径，无需填写外部域名。
   （若日后前后端分离部署，把下方 API 常量改为完整后端地址即可） */
(function () {
  var API = "/api/feedback"; // 反馈接口前缀（同一域名，相对路径即可）
  var overlay = document.getElementById("fbOverlay");
  var textarea = document.getElementById("fbText");
  var listEl = document.getElementById("fbPublicList");
  var toastEl = document.getElementById("fbToast");
  var toastTimer = null;

  // ===== 重要说明（管理员可实时编辑，弹窗打开期间每3秒轮询同步） =====
  var noteEl = document.getElementById("fbNote");
  var noticeTimer = null;
  var DEFAULT_NOTICE =
    "重要说明：\n" +
    "1. 本课程表仅供参考，请以学校教务系统课表为准。\n" +
    "2. 反馈不会即时回复，管理员定期查看。\n" +
    "3. 请勿提交身份证、手机号等隐私信息。";

  // GET /api/notice：读取说明并更新到弹窗（内容为空则隐藏说明框）
  function loadNotice() {
    fetch("/api/notice")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var content = (d && d.ok && typeof d.content === "string") ? d.content : DEFAULT_NOTICE;
        if (content.trim() === "") {
          noteEl.style.display = "none";
        } else {
          noteEl.style.display = "";
          noteEl.textContent = content;
        }
      })
      .catch(function () {
        // 网络异常保持原样（不闪断）
      });
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // 打开弹窗时自动 GET 公开反馈（isPublic=1），渲染用户原文 + 管理员回复
  function loadPublic() {
    listEl.innerHTML = '<div class="fb-empty">加载中…</div>';
    fetch(API + "/public")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var list = (d && d.list) || [];
        listEl.innerHTML = "";
        if (!list.length) {
          listEl.innerHTML = '<div class="fb-empty">暂无公开反馈</div>';
          return;
        }
        list.forEach(function (it) {
          var item = document.createElement("div");
          item.className = "fb-public-item";
          item.innerHTML =
            '<div class="fb-q">' + escapeHtml(it.content) + '</div>' +
            (it.adminReply ? '<div class="fb-a">' + escapeHtml(it.adminReply) + '</div>' : "");
          listEl.appendChild(item);
        });
      })
      .catch(function () {
        listEl.innerHTML = '<div class="fb-empty">公开反馈加载失败，请检查网络</div>';
      });
  }

  // 提交反馈：校验非空 → POST /api/feedback/add → 成功 toast + 自动关闭
  function submitFeedback() {
    var content = textarea.value.trim();
    if (!content) { showToast("反馈内容不能为空"); return; }
    fetch(API + "/add", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: content, deviceId: (window.getDeviceId ? window.getDeviceId() : "") })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok || !res.d.ok) {
          showToast((res.d && res.d.error) || "提交失败，请稍后重试");
          return;
        }
        showToast("反馈提交成功，感谢反馈");
        textarea.value = "";
        overlay.classList.remove("show");
      })
      .catch(function () { showToast("网络异常，请检查网络后重试"); });
  }

  // 打开弹窗：加载公开反馈 + 重要说明，并启动每3秒轮询（管理员修改说明后无需刷新即可看到）
  function openModal() {
    overlay.classList.add("show");
    loadPublic();
    loadNotice();
    if (!noticeTimer) noticeTimer = setInterval(loadNotice, 3000);
  }
  // 关闭弹窗：停止说明轮询，避免无谓请求
  function closeModal() {
    overlay.classList.remove("show");
    if (noticeTimer) { clearInterval(noticeTimer); noticeTimer = null; }
  }

  document.getElementById("feedbackFab").addEventListener("click", openModal);
  document.getElementById("fbClose").addEventListener("click", closeModal);
  document.getElementById("fbCancel").addEventListener("click", closeModal);
  // 点击半透明遮罩关闭弹窗
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
  document.getElementById("fbSubmit").addEventListener("click", submitFeedback);

  // 注册用户端 Service Worker 并订阅推送（role=user），用于接收管理员回复通知
  if (window.initPush) { try { window.initPush("/user-sw.js", "user"); } catch (e) {} }
})();
</script>
</body>
